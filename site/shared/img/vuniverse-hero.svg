<!-- (c) 2026-* Frederick Bloom — Hanaden — Vuniverse Hero Banner -->
<!-- Editable SVG: Wide hero background with namespace isolation motif -->
<!-- Edit colors: green #3bf5a9, purple #7c3aed, bg #060a14 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <filter id="h-glow-g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="h-glow-p" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="h-glow-orb" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <radialGradient id="h-orb-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#3bf5a9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3bf5a9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-fade-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060a14" stop-opacity="0"/>
      <stop offset="70%" stop-color="#060a14" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#060a14" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="h-fade-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060a14" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#060a14" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <!-- transparent background -->

  <!-- Distant grid -->
  <g opacity="0.08">
    <line x1="0" y1="0" x2="1600" y2="600" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="1200" y2="600" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="600" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="1200" y1="0" x2="400" y2="600" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="1600" y1="0" x2="0" y2="600" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1600" y2="200" stroke="#7c3aed" stroke-width="0.3"/>
    <line x1="0" y1="400" x2="1600" y2="400" stroke="#7c3aed" stroke-width="0.3"/>
  </g>

  <!-- Outer purple boundary (host) — centered -->
  <g transform="translate(800, 270)" filter="url(#h-glow-p)">
    <polygon points="-200,-100 0,-170 200,-100 0,-30"
             fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.25"/>
    <polygon points="-200,-100 -200,60 0,130 0,-30"
             fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.2"/>
    <polygon points="200,-100 200,60 0,130 0,-30"
             fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.2"/>
    <!-- Grid subdivisions -->
    <line x1="-100" y1="-65" x2="-100" y2="95" stroke="#7c3aed" stroke-width="0.4" opacity="0.15"/>
    <line x1="100" y1="-65" x2="100" y2="95" stroke="#7c3aed" stroke-width="0.4" opacity="0.15"/>
    <line x1="-150" y1="15" x2="150" y2="15" stroke="#7c3aed" stroke-width="0.4" opacity="0.12"/>
  </g>

  <!-- Inner green cube (sandbox) -->
  <g transform="translate(800, 278)" filter="url(#h-glow-g)">
    <polygon points="-110,-55 0,-95 110,-55 0,-15"
             fill="rgba(59,245,169,0.03)" stroke="#3bf5a9" stroke-width="2.2" opacity="0.9"/>
    <polygon points="-110,-55 -110,45 0,85 0,-15"
             fill="rgba(59,245,169,0.04)" stroke="#3bf5a9" stroke-width="2.2" opacity="0.75"/>
    <polygon points="110,-55 110,45 0,85 0,-15"
             fill="rgba(59,245,169,0.04)" stroke="#3bf5a9" stroke-width="2.2" opacity="0.75"/>
    <line x1="-110" y1="45" x2="0" y2="85" stroke="#3bf5a9" stroke-width="2.5" opacity="0.9"/>
    <line x1="110" y1="45" x2="0" y2="85" stroke="#3bf5a9" stroke-width="2.5" opacity="0.9"/>
  </g>

  <!-- Orb -->
  <g transform="translate(800, 280)" filter="url(#h-glow-orb)">
    <circle cx="0" cy="0" r="18" fill="url(#h-orb-grad)"/>
    <circle cx="0" cy="0" r="8" fill="#fff" opacity="0.85"/>
  </g>

  <!-- Constellation particles -->
  <g opacity="0.5">
    <circle cx="150" cy="120" r="2" fill="#7c3aed"/><circle cx="1450" cy="100" r="1.5" fill="#7c3aed"/>
    <circle cx="250" cy="450" r="1.5" fill="#7c3aed"/><circle cx="1350" cy="480" r="2" fill="#7c3aed"/>
    <circle cx="400" cy="80" r="1" fill="#3bf5a9" opacity="0.4"/>
    <circle cx="1200" cy="90" r="1" fill="#3bf5a9" opacity="0.4"/>
    <circle cx="100" cy="300" r="1.5" fill="#7c3aed" opacity="0.3"/>
    <circle cx="1500" cy="320" r="1.5" fill="#7c3aed" opacity="0.3"/>
    <circle cx="300" cy="200" r="1" fill="#7c3aed" opacity="0.3"/>
    <circle cx="1300" cy="220" r="1" fill="#7c3aed" opacity="0.3"/>
    <circle cx="500" cy="500" r="1" fill="#7c3aed" opacity="0.2"/>
    <circle cx="1100" cy="520" r="1" fill="#7c3aed" opacity="0.2"/>
    <!-- Connections -->
    <line x1="150" y1="120" x2="300" y2="200" stroke="#7c3aed" stroke-width="0.4" opacity="0.2"/>
    <line x1="400" y1="80" x2="300" y2="200" stroke="#7c3aed" stroke-width="0.4" opacity="0.15"/>
    <line x1="1200" y1="90" x2="1300" y2="220" stroke="#7c3aed" stroke-width="0.4" opacity="0.15"/>
    <line x1="1450" y1="100" x2="1300" y2="220" stroke="#7c3aed" stroke-width="0.4" opacity="0.2"/>
  </g>

  <!-- Edge fades -->
  <rect width="1600" height="600" fill="url(#h-fade-bottom)"/>
  <rect width="1600" height="600" fill="url(#h-fade-top)"/>
</svg>
