<!-- (c) 2026-* Frederick Bloom — Hanaden — Vuniverse Logo -->
<!-- Editable SVG: Namespace isolation cube with contained orb -->
<!-- Colors: green #3bf5a9, purple #7c3aed, deep space #060a14 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Glow filters -->
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-orb" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradient for orb -->
    <radialGradient id="orb-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#3bf5a9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3bf5a9" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid pattern for outer boundary -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#7c3aed" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <!-- transparent background -->

  <!-- Outer purple grid boundary (host system) -->
  <g transform="translate(200, 140)" filter="url(#glow-purple)">
    <!-- Back face -->
    <polygon points="-120,-60 0,-100 120,-60 0,-20"
             fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.3"/>
    <!-- Left face -->
    <polygon points="-120,-60 -120,40 0,80 0,-20"
             fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.25"/>
    <!-- Right face -->
    <polygon points="120,-60 120,40 0,80 0,-20"
             fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.25"/>
    <!-- Top face -->
    <polygon points="-120,-60 0,-100 120,-60 0,-20"
             fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.15"/>

    <!-- Grid lines on faces -->
    <line x1="-60" y1="-40" x2="-60" y2="60" stroke="#7c3aed" stroke-width="0.3" opacity="0.2"/>
    <line x1="60" y1="-40" x2="60" y2="60" stroke="#7c3aed" stroke-width="0.3" opacity="0.2"/>
    <line x1="-90" y1="10" x2="90" y2="10" stroke="#7c3aed" stroke-width="0.3" opacity="0.2"/>
  </g>

  <!-- Inner green cube (the sandbox / vuniverse) -->
  <g transform="translate(200, 145)" filter="url(#glow-green)">
    <!-- Back face -->
    <polygon points="-65,-32 0,-55 65,-32 0,-10"
             fill="rgba(59,245,169,0.03)" stroke="#3bf5a9" stroke-width="1.8" opacity="0.9"/>
    <!-- Left face -->
    <polygon points="-65,-32 -65,28 0,50 0,-10"
             fill="rgba(59,245,169,0.04)" stroke="#3bf5a9" stroke-width="1.8" opacity="0.8"/>
    <!-- Right face -->
    <polygon points="65,-32 65,28 0,50 0,-10"
             fill="rgba(59,245,169,0.04)" stroke="#3bf5a9" stroke-width="1.8" opacity="0.8"/>
    <!-- Bottom edge emphasis -->
    <line x1="-65" y1="28" x2="0" y2="50" stroke="#3bf5a9" stroke-width="2" opacity="0.9"/>
    <line x1="65" y1="28" x2="0" y2="50" stroke="#3bf5a9" stroke-width="2" opacity="0.9"/>
  </g>

  <!-- Contained orb (the process / prisoner) -->
  <g transform="translate(200, 148)" filter="url(#glow-orb)">
    <circle cx="0" cy="0" r="12" fill="url(#orb-gradient)"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Constellation points (host connections) -->
  <g opacity="0.4">
    <circle cx="45" cy="60" r="1.5" fill="#7c3aed"/>
    <circle cx="355" cy="80" r="1" fill="#7c3aed"/>
    <circle cx="70" cy="240" r="1.2" fill="#7c3aed"/>
    <circle cx="330" cy="230" r="1.5" fill="#7c3aed"/>
    <circle cx="50" cy="150" r="1" fill="#3bf5a9" opacity="0.5"/>
    <circle cx="350" cy="160" r="1" fill="#3bf5a9" opacity="0.5"/>
    <circle cx="150" cy="40" r="0.8" fill="#7c3aed"/>
    <circle cx="250" cy="35" r="0.8" fill="#7c3aed"/>
    <circle cx="100" cy="260" r="1" fill="#7c3aed" opacity="0.3"/>
    <circle cx="300" cy="270" r="1" fill="#7c3aed" opacity="0.3"/>

    <!-- Faint connection lines -->
    <line x1="45" y1="60" x2="150" y2="40" stroke="#7c3aed" stroke-width="0.3" opacity="0.3"/>
    <line x1="250" y1="35" x2="355" y2="80" stroke="#7c3aed" stroke-width="0.3" opacity="0.3"/>
    <line x1="70" y1="240" x2="50" y2="150" stroke="#7c3aed" stroke-width="0.3" opacity="0.2"/>
    <line x1="330" y1="230" x2="350" y2="160" stroke="#7c3aed" stroke-width="0.3" opacity="0.2"/>
  </g>
</svg>
