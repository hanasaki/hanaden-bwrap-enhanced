[settings]
all_compile            = false
asdf_compat            = true
disable_backends = [
  "vfox", "ubi", "http", "conda",
  "cargo", "npm", "pipx", "gem", "dotnet", "spm"
]
experimental           = true
minimum_release_age    = "25h"
activate_aggressive    = false
verbose                = false
jobs                   = 10
not_found_auto_install = true

[tools]
# Test framework
bats                   = "latest"

# AI agent compressed output
rtk                    = "latest"

# JSON construction/validation (test harness)
jq                     = "latest"

# HTML report generation (stdlib only, per TestHarnessSystem spec)
python                 = "3.13.15"

# Shell formatting
shfmt                  = "latest"

# Syntax-highlighted viewing (dev convenience)
bat                    = "latest"

[task_config]
