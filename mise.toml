# mise.toml
# Global superset toolchain config merged from all variants.
# See ~/.config/mise/README.md for full tool documentation and URLs.

#[install]
#lockfile = true # Forces a text-based yarn/pnpm style lockfile

[settings]
#credential_command = "gh auth token"
# shims=yes / no-shims=yes
all_compile            = false
asdf_compat            = true
#disable_backends       = ["asdf","vfox"]
#disable_backends = [
#  "asdf", "vfox", "core", "ubi", "http", "conda",
#  "cargo", "go", "npm", "pipx", "gem", "dotnet", "spm"
#]
# Leaves 'core' alive for Python/Node, allows Tier 1, but blocks all legacy/unverified layers
disable_backends = [
  "vfox", "ubi", "http", "conda",
  "cargo", "npm", "pipx", "gem", "dotnet", "spm"
]

experimental           = true
minimum_release_age    = "25h"
#npm.package_manager    = "pnpm"
npm.package_manager    = "pnpm"
activate_aggressive    = false
verbose                = false
jobs                   = 10
not_found_auto_install = true
# Crucial: Forces mise to build and load the local venv automatically
python.uv_venv_auto = "create|source"

[plugins]
# shims=yes / no-shims=yes

[env]
# shims=no / no-shims=yes
# Delegated to direnv's .envrc to ensure compatibility under shims mode.
# CC                     = "clang"
# CXX                    = "clang++"
# _.path                 = ["./node_modules/.bin"]
CARGO_UNSTABLE_SCRIPT    = "yes"

[shell_alias]
# shims=no / no-shims=yes
podman                 = "podman-remote-static-linux_amd64"
docker                 = "podman"
mise-tasks-ls-extended = "mise tasks ls -x"

[tools]
# shims=yes / no-shims=yes
usage                  = "latest"
#"aqua:spf13/cobra-cli" = "latest"
